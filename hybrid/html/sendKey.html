<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=0">
	<link href="http://fonts.googleapis.com/css?family=Roboto:300" rel="stylesheet">
	<title>谷歌地图-初始化地图</title>
	<link rel="stylesheet" href="./css/index.css">
</head>
<body>
	<div id="map"></div>
	<div class="img-container">
		<div class="img-item" id="wifi">
			<img src="http://k1sw.wiselink.net.cn/img/app2.0/desk/wifi.png" alt="WiFi">
			<img src="http://k1sw.wiselink.net.cn/img/app2.0/desk/wifi_1.png" alt="WiFi">
		</div>
		<div class="img-item" id="bluetooth">
			<img src="http://k1sw.wiselink.net.cn/img/app2.0/desk/bluetooth.png" alt="蓝牙">
			<img src="http://k1sw.wiselink.net.cn/img/app2.0/desk/bluetooth_1.png" alt="蓝牙">
		</div>
	</div>
	<div class="floatingLayer">
		<div class="button_style" id="btnReturn">
			<img src="https://k3a.wiselink.net.cn/img/app/desk/ren_return.png" alt="">
			<div id="btnReturnLang">归还车辆</div>
		</div>
		<div class="button_style" id="btn3">
			<img src="https://k3a.wiselink.net.cn/img/app/desk/ren_unlock.png" alt="">
			<div id="btn3Lang">开锁</div>
		</div>
		<div class="button_style" id="btn1">
			<img src="https://k3a.wiselink.net.cn/img/app/desk/ren_lock.png" alt="">
			<div id="btn1Lang">关锁</div>
		</div>
		<div class="button_style" id="btn5">
			<img src="https://k3a.wiselink.net.cn/img/app/desk/ren_lookFor.png" alt="">
			<div id="btn5Lang">寻车</div>
		</div>
		<div class="button_style" id="btnSee">
			<img src="https://k3a.wiselink.net.cn/img/app/desk/ren_photo.png" alt="">
			<div id="btnSeeLang">查看照片</div>
		</div>
	</div>

	<script src="https://js.cdn.aliyun.dcloud.net.cn/dev/uni-app/uni.webview.1.5.2.js"></script>
	<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDGzLnrbvfiqdmemX8yR4CTc6n2SzjOaBM&libraries=places&callback=initMap" async defer></script>
	<script src="./js/sendKey.js"></script>
</body>
</html>
